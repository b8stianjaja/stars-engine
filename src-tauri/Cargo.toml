[package]
name = "stars-engine"
version = "1.0.0"
description = "Hybrid 2.5D/3D Deterministic Simulation Subsystem"
authors = ["Tooling Engineer"]
edition = "2021"

[lib]
name = "app_lib"
path = "src/lib.rs"

[dependencies]
tauri = { version = "2.0.0", features = ["log"] }
tauri-plugin-fs = "2.0.0"
tauri-plugin-dialog = "2.0.0"
tauri-plugin-log = "2.0.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
log = "0.4"

[features]
default = ["studio"]
studio = []
runtime = [] # Activa el modo de ejecución directa omitiendo llamadas de edición de disco externas
